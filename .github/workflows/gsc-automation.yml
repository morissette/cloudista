---
name: GSC Indexing Automation

"on":
  schedule:
    - cron: "0 9 * * *"  # daily 09:00 UTC
  workflow_dispatch:
    inputs:
      skip_resubmit:
        description: "Skip the stale-URL resubmit step"
        type: boolean
        default: false
  pull_request:
    paths:
      - "blog/*.txt"

permissions:
  contents: write
  pull-requests: write

jobs:
  daily:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-auth requests

      - name: Write service-account key
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
        run: |
          mkdir -p scripts
          printf '%s' "$GSC_SA_JSON" > /tmp/gsc-sa.json
          test -s /tmp/gsc-sa.json || (echo "GSC_SA_JSON secret is empty"; exit 1)

      - name: Restore prior history + indexing state
        uses: actions/cache@v4
        with:
          path: |
            scripts/.gsc_status_history.json
            scripts/.indexing_done.txt
          key: gsc-state-${{ github.run_id }}
          restore-keys: |
            gsc-state-

      - name: Submit new sitemap URLs to Indexing API
        env:
          GSC_SA_KEY_FILE: /tmp/gsc-sa.json
        run: python3 scripts/request_indexing.py || true

      - name: Build daily index status report
        env:
          GSC_SA_KEY_FILE: /tmp/gsc-sa.json
        run: python3 scripts/gsc_status.py

      - name: Resubmit stale Discovered URLs
        if: ${{ github.event_name == 'schedule' || inputs.skip_resubmit != true }}
        env:
          GSC_SA_KEY_FILE: /tmp/gsc-sa.json
          MIN_AGE_DAYS: "7"
          MAX_RESUBMITS: "50"
        run: python3 scripts/gsc_resubmit_stale.py || true

      - name: Append report to step summary
        run: cat docs/gsc-status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report + history as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gsc-status-${{ github.run_id }}
          path: |
            docs/gsc-status.md
            scripts/.gsc_status_history.json
            scripts/.indexing_done.txt
          retention-days: 30

      - name: Wipe SA key
        if: always()
        run: rm -f /tmp/gsc-sa.json

  pr-inspect:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-auth requests

      - name: Write service-account key
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
        run: |
          printf '%s' "$GSC_SA_JSON" > /tmp/gsc-sa.json
          test -s /tmp/gsc-sa.json || (echo "GSC_SA_JSON secret is empty"; exit 1)

      - name: Inspect changed posts
        env:
          GSC_SA_KEY_FILE: /tmp/gsc-sa.json
        run: |
          git diff --name-only \
            "origin/${{ github.base_ref }}"...HEAD -- 'blog/*.txt' \
            | python3 scripts/gsc_inspect_pr.py > comment.md
          cat comment.md

      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8').trim();
            if (!body) return;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- gsc-inspect -->';
            const tagged = marker + '\n' + body;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: tagged });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: tagged });
            }

      - name: Wipe SA key
        if: always()
        run: rm -f /tmp/gsc-sa.json
